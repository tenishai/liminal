# Generated by Gojira. Sizing comes from the 'gateway' workload class —
# override in gojira.yaml with a justification, not here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: liminal
  labels:
    app.kubernetes.io/name: liminal
    gojira.dev/managed: "true"
    gojira.dev/class: gateway
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: liminal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: liminal
        gojira.dev/managed: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        fsGroup: 10002
      nodeSelector:
        kubernetes.io/arch: arm64
        cloud.google.com/compute-class: "Scale-Out"
      tolerations:
        - { key: kubernetes.io/arch, operator: Equal, value: arm64, effect: NoSchedule }
      containers:
        - name: app
          image: gojira-app
          ports:
            - name: http
              containerPort: 9100
          env:
            - name: LIMINAL_CABAL_URL
              value: "http://cabal.cabal.svc.cluster.local"
            - name: LIMINAL_JWKS_URL
              value: "http://cabal.cabal.svc.cluster.local/.well-known/jwks.json"
            - name: LIMINAL_MEMORY_DB
              value: "/data/memory.db"
          envFrom:
            - secretRef:
                name: liminal-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 4Gi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 8Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: liminal-data
