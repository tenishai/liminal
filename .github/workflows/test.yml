name: test

# Manual trigger only until GH_PAT_REPOS is added to repo secrets.
# Once the PAT is in place (Settings → Secrets and variables → Actions →
# New repository secret, name `GH_PAT_REPOS`, value: a PAT with `repo`
# scope so the workflow can clone the private techne repo), uncomment
# the push/pull_request triggers below to re-enable automatic runs.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
      fail-fast: false

    steps:
      - name: Checkout limenal
        uses: actions/checkout@v4
        with:
          path: limenal

      # techne is the optional backend for the `memory` handler tests
      # (sibling-checkout convention, per limenal README quickstart).
      - name: Checkout techne
        uses: actions/checkout@v4
        with:
          repository: dimartin/techne
          token: ${{ secrets.GH_PAT_REPOS }}
          path: techne

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: limenal/pyproject.toml

      - name: Install dependencies
        working-directory: limenal
        run: |
          python -m pip install --upgrade pip
          pip install -e "../techne"
          pip install -e ".[dev]"

      - name: Ruff lint
        working-directory: limenal
        run: ruff check src tests

      - name: Pytest
        working-directory: limenal
        run: pytest -q
