name: test

# Every job runs on GitHub-hosted runners: this repo is public, and no runner we
# operate may be reachable from it. tests/test_ci_workflow.py pins that.
# unit runs on every push to main and every pull request, fork PRs included —
# no private deps, no secret required.
# integration runs on workflow_dispatch only. It clones the techne sibling
# without a token, so it works once techne is public (agora#31).
# `ci` and `dco` are the two checks a branch ruleset requires.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- unit: no sibling deps; push, dispatch, every pull request ------------
  # No `if:` on purpose: a skipped unit would leave fork PRs ungated. The `ci` job
  # below turns anything but success into a failure.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
      fail-fast: false

    steps:
      - name: Checkout liminal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: liminal

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: liminal/pyproject.toml

      - name: Install (no siblings)
        working-directory: liminal
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        working-directory: liminal
        run: ruff check src tests

      - name: Pytest (unit — memory handler tests auto-skip via importorskip)
        working-directory: liminal
        run: pytest -q

  # ---- integration: full suite with techne ----------------------------------
  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.12']
      fail-fast: false

    steps:
      - name: Checkout liminal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: liminal

      # techne at the tag the Dockerfile pins, read from its TECHNE_VERSION so
      # the suite tests the techne an install gets. Unpinned, this tested
      # whatever techne's main was that day.
      - name: Read the pinned techne version
        id: techne
        working-directory: liminal
        run: echo "ref=v$(sed -n 's/^ARG TECHNE_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Checkout techne
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: tenishai/techne
          ref: ${{ steps.techne.outputs.ref }}
          path: techne

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: liminal/pyproject.toml

      - name: Install (with techne)
        working-directory: liminal
        run: |
          python -m pip install --upgrade pip
          pip install -e "../techne"
          pip install -e ".[dev]"

      - name: Pytest (full suite)
        working-directory: liminal
        run: pytest -q

  # ---- ci: the one check a branch ruleset requires, with dco ----------------
  # Required by name, so it must always report. `if: always()` runs it when unit
  # fails or is cancelled, and the step fails on anything but success: a skipped
  # job counts as passing in GitHub's UI, and must not here.
  ci:
    runs-on: ubuntu-latest
    needs: [unit]
    if: always()
    steps:
      - name: Fail unless unit succeeded
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
        run: |
          echo "unit: $UNIT_RESULT"
          [ "$UNIT_RESULT" = success ]
