# The release image: what a pushed vX.Y.Z tag turns into. Nothing else publishes an
# image (agora issue 58). Copied from tenishai/cabal's release.yml. In order, and each
# step has to pass for the next to run:
#
#   1. the whole of test.yml, on the tagged commit, and the arm64 image built and run on
#      an arm64 runner (the `arm64` job), so arm64 is proved natively before anything is
#      pushed and on every dry run
#   2. the tag names the version pyproject.toml declares
#   3. the image, built for this machine: it starts and reports that version, and it has
#      no high or critical vulnerability that has a fix
#   4. the multi-arch image, published to ghcr under the tag and the short commit sha,
#      with an SBOM and build provenance attached
#   5. the GitHub release: created from CHANGELOG.md if it does not exist yet, with the
#      SBOM and its checksum as files and the image digest in the text. The wheel is
#      still published by hand (RELEASING.md).
#
# techne comes from a checkout of the tag the Dockerfile pins (TECHNE_VERSION), handed to
# the build as the `techne` context the Dockerfile already takes, so the build needs no
# index and no token.
#
# To build a tag again, run this workflow from that tag (the tag must contain this file):
#   gh workflow run release.yml --ref vX.Y.Z
# If that tag's image is already on ghcr, the run does not build or push it again: a
# rebuild gets a new digest, and nodes with `imagePullPolicy: IfNotPresent` would run
# different images under one tag. It checks, scans (reporting, not failing) and makes the
# SBOM of the published image instead, and finishes the GitHub release with its digest.
# The existence check fails the run on any answer but "found" or "not found", so a
# registry error can't pass for a missing tag.
#
# The `arm64` job builds from the checkout every time, a re-run of a published tag included
# (it never pushes): if the world has moved since the tag, the run says so.
#
# A dry run, from a branch, does steps 1 and 3, makes the SBOM and checksums, and runs the
# existence check against the version's tag, and publishes nothing:
#   gh workflow run release.yml --ref main
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/${{ github.repository }}
jobs:
  checks:
    uses: ./.github/workflows/test.yml

  # ubuntu-24.04-arm is free only while the repository is public; a private repo would fail
  # this job, and arm64 would need QEMU or paid minutes instead.
  arm64:
    name: arm64 image
    needs: checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: liminal

      - name: The version and techne tag this checkout declares
        id: version
        working-directory: liminal
        run: |
          echo "version=$(sed -nE 's/^version = "([^"]+)"/\1/p' pyproject.toml | head -1)" >> "$GITHUB_OUTPUT"
          echo "techne=v$(sed -n 's/^ARG TECHNE_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Checkout techne at the tag the Dockerfile pins
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: tenishai/techne
          ref: ${{ steps.version.outputs.techne }}
          path: techne

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build the arm64 image (never pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: liminal
          build-contexts: techne=techne
          platforms: linux/arm64
          load: true
          push: false
          pull: true
          tags: candidate:arm64
          build-args: APT_REFRESH=${{ steps.version.outputs.day }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache

      - name: The arm64 image runs natively and reports the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          arch="$(docker run --rm candidate:arm64 uname -m)"
          [ "$arch" = aarch64 ] || { echo "::error::image runs as $arch, not aarch64"; exit 1; }
          got="$(docker run --rm candidate:arm64 python -c 'import liminal; print(liminal.__version__)')"
          echo "arm64 image reports $got"
          [ "$got" = "$VERSION" ] || { echo "::error::arm64 image reports $got, pyproject.toml says $VERSION"; exit 1; }
          docker run --rm candidate:arm64 liminal --help > /dev/null

  release:
    name: release
    needs: [checks, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: liminal

      - name: The tag names the version the project declares (a branch is a dry run)
        id: version
        working-directory: liminal
        run: |
          declared="$(sed -nE 's/^version = "([^"]+)"/\1/p' pyproject.toml | head -1)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            case "$tag" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::$tag is not a vX.Y.Z tag; run this workflow from a release tag"; exit 1;; esac
            [ "${tag#v}" = "$declared" ] || { echo "::error::tag $tag but pyproject.toml declares $declared"; exit 1; }
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "check_tag=$tag" >> "$GITHUB_OUTPUT"
          else
            tag="dry-run"
            echo "::notice::dry run from $GITHUB_REF_NAME: build, check and scan only; nothing is published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "check_tag=v$declared" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$declared" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "techne=v$(sed -n 's/^ARG TECHNE_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"
          mkdir -p ../dist

      - name: Checkout techne at the tag the Dockerfile pins
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: tenishai/techne
          ref: ${{ steps.version.outputs.techne }}
          path: techne

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On a tag, `reuse` means the image is already out: check it, never push it again.
      # On a dry run the check runs too (against the version's tag), so the first real
      # answer from ghcr is seen before a tag; it never sets `reuse` there.
      - name: Is this tag's image already published
        id: published
        shell: bash
        env:
          REF: ${{ env.IMAGE }}:${{ steps.version.outputs.check_tag }}
          PUBLISH: ${{ steps.version.outputs.publish }}
        run: |
          set -euo pipefail
          if out="$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest.Digest}}' 2>inspect.err)"; then
            digest="$(printf '%s' "$out" | tr -d '"[:space:]')"
            case "$digest" in
              sha256:[0-9a-f]*) ;;
              *) echo "::error::$REF: inspect succeeded but printed no digest: $out"; exit 1;;
            esac
            echo "::notice::$REF is already published ($digest)"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            [ "$PUBLISH" = true ] && reuse=true || reuse=false
          elif grep -qi ': not found' inspect.err; then
            echo "$REF is not published yet"
            echo "exists=false" >> "$GITHUB_OUTPUT"
            reuse=false
          else
            echo "::error::could not tell whether $REF is published:"; cat inspect.err; exit 1
          fi
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
          if [ "$reuse" = true ]; then subject="${REF%:*}@$digest"; else subject=candidate:release; fi
          echo "subject=$subject" >> "$GITHUB_OUTPUT"

      - name: Build the image for this machine
        if: steps.published.outputs.reuse != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: liminal
          build-contexts: techne=techne
          load: true
          pull: true
          tags: candidate:release
          # The day goes in so the OS package upgrade runs again instead of coming out of the cache.
          build-args: APT_REFRESH=${{ steps.version.outputs.day }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache

      - name: The image starts and reports the tagged version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SUBJECT: ${{ steps.published.outputs.subject }}
        run: |
          got="$(docker run --rm "$SUBJECT" python -c 'import liminal; print(liminal.__version__)')"
          echo "image reports $got"
          [ "$got" = "$VERSION" ] || { echo "::error::image reports $got, tag says $VERSION"; exit 1; }
          docker run --rm "$SUBJECT" liminal --help > /dev/null

      # A published image is scanned and reported, never failed: nothing would be pushed,
      # and a CVE found since the tag must not stop its release from being finished.
      - name: No high or critical vulnerability that has a fix
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          image: ${{ steps.published.outputs.subject }}
          fail-build: ${{ steps.published.outputs.reuse != 'true' }}
          severity-cutoff: high
          only-fixed: true
          output-format: table
          # What the scan does not block on, each with its reason. Ignored matches are dropped from
          # the table, so .grype.yaml is where they are recorded.
          config: liminal/.grype.yaml

      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ${{ steps.published.outputs.subject }}
          format: spdx-json
          output-file: dist/${{ github.event.repository.name }}-${{ steps.version.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - name: Build and publish, both architectures
        id: build
        if: steps.version.outputs.publish == 'true' && steps.published.outputs.reuse != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: liminal
          build-contexts: techne=techne
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          build-args: APT_REFRESH=${{ steps.version.outputs.day }}
          # Layers that did not change come from the last build instead of being rebuilt
          # for both architectures; mode=max also caches the intermediate stages.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.sha }}

      - name: The GitHub release
        if: steps.version.outputs.publish == 'true'
        working-directory: liminal
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
          DIGEST: ${{ steps.published.outputs.reuse == 'true' && steps.published.outputs.digest || steps.build.outputs.digest }}
        run: |
          line="Image: \`${IMAGE}@${DIGEST}\` (tags \`${TAG}\`, \`${SHA}\`; linux/amd64, linux/arm64)"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # Notes are this version's section of the changelog.
            awk -v v="$VERSION" '/^## \[/{on = index($0, "## [" v "]") == 1; next} on' CHANGELOG.md > notes.md
            [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" ../dist/* --clobber
          gh release view "$TAG" --json body --jq .body > body.md
          grep -qF "$DIGEST" body.md || { printf '\n\n%s\n' "$line" >> body.md; gh release edit "$TAG" --notes-file body.md; }
