[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "limenal"
version = "0.1.0"
description = "MCP gateway — one MCP connection per agent, many backend handlers behind it"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [{ name = "Richard DiMartino" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.10",
    "structlog>=24.4",
    "anyio>=4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "joserfc>=1.0",
    "httpx>=0.27",
    "cryptography>=44",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]
# Enables the techne-backed `memory` handler (imported lazily; limenal runs
# without it). techne is not on a public index, so pair this extra with the
# git source pin: `pip install -r requirements-sources.txt ".[memory]"`.
# Dev/CI keep an editable techne instead: `pip install -e ../techne`.
memory = ["techne>=0.9.0"]

[project.scripts]
limenal = "limenal.cli:main"

# Built-in reference handlers register here. Third-party packages can also
# add to this group to be auto-discovered at startup.
[project.entry-points."limenal.handlers"]
scratchpad = "limenal.handlers.scratchpad:get_handler"
web        = "limenal.handlers.web:get_handler"
files      = "limenal.handlers.files:get_handler"
memory     = "limenal.handlers.memory:get_handler"
notify     = "limenal.handlers.notify:get_handler"

[project.urls]
Source = "https://github.com/tenishai/limenal"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
