[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tenish-liminal"
version = "0.9.1"
description = "MCP gateway — one MCP connection per agent, many backend handlers behind it"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [{ name = "tenish" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.10",
    "structlog>=24.4",
    "anyio>=4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "joserfc>=1.0",
    "httpx>=0.27",
    "cryptography>=44",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    # tests/test_ci_workflow.py parses .github/workflows/test.yml. pyyaml is
    # importable today only because uvicorn[standard] pulls it in; declared so a
    # dependency bump cannot take the fork-guard test with it.
    "pyyaml>=6.0",
]
# Enables the techne-backed `memory` handler (imported lazily; liminal runs
# without it). techne is not on a public index, so pair this extra with the
# git source pin: `pip install -r requirements-sources.txt ".[memory]"`.
# Dev, and CI's manual integration job, use an editable techne instead:
# `pip install -e ../techne`.
memory = ["tenish-techne>=0.18.2"]
# Enables the `aws` handler's STS and API calls (imported lazily; the handler
# registers without it and refuses calls with a sentence naming this extra).
aws = ["botocore>=1.35"]

[project.scripts]
liminal = "liminal.cli:main"

# Built-in reference handlers register here. Third-party packages can also
# add to this group to be auto-discovered at startup.
[project.entry-points."liminal.handlers"]
scratchpad = "liminal.handlers.scratchpad:get_handler"
web        = "liminal.handlers.web:get_handler"
files      = "liminal.handlers.files:get_handler"
memory     = "liminal.handlers.memory:get_handler"
notify     = "liminal.handlers.notify:get_handler"
aws        = "liminal.handlers.aws:get_handler"

[project.urls]
Source = "https://github.com/tenishai/liminal"

[tool.setuptools.packages.find]
where = ["src"]

# The guides `liminal guide` prints. They live inside the package because
# setuptools ships package data only from there, and the Dockerfile copies only
# src/. tests/test_bundled_docs.py checks every guide in liminal.docs.GUIDES
# matches this glob.
[tool.setuptools.package-data]
"liminal.docs" = ["*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# liminal#85. WITHOUT THIS, `import liminal` resolves through whatever is
# INSTALLED -- and the dev venv has liminal installed editable against the
# canonical checkout. So `pytest` run from a git worktree at a PR head tests
# MAIN, not the PR, and it looks like a normal green run.
#
# It has already produced a false "their PRs are broken" report (#83/#84 were
# green in CI the whole time) and Prudence hit it during the #81 review. The
# dangerous half is the other one: when the shadowed tree happens to be
# COMPATIBLE, the wrong tree passes silently and nothing disagrees.
#
# `pythonpath` puts these on sys.path ahead of the .pth the editable install
# adds, so the checkout you are standing in is the one you test. Do not remove
# it in favour of the PYTHONPATH= workaround: that is per-invocation, invisible
# to anyone reading the repo, and the review sandbox refuses env-prefixed
# commands outright.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
